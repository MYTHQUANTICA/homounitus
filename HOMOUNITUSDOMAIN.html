<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SPECIAL NFT MINTING IMAGE (HEAVY GOTHIC)</title>
    <style>
        body { background-color: #000000; color: #ffffff; font-family: monospace; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; position: relative; }
        
        /* 1단계 시간 서사 세팅 */
        .timeline-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 35px; }
        .timeline-step { font-size: 14px; color: #cccccc; letter-spacing: 5px; text-transform: uppercase; font-weight: bold; }
        
        /* 전체 중앙 정렬 박스 (640px 대형 규격 유지) */
        .center-frame { display: flex; flex-direction: column; width: 640px; text-align: center; }

        /* 중간 크기 정중앙 다음 세대 문구 (24px 고딕체 스타일 매칭) */
        .sub-header-top { font-size: 24px; font-weight: 800; text-transform: uppercase; color: #aaaaaa; text-align: center; letter-spacing: 2px; margin-bottom: 30px; width: 100%; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }

        /* [수정] 글꼴을 무형의 시스템 고딕체로 치환하고 두께를 인간이 표현할 수 있는 최대치(900)로 설정 */
        .main { font-size: 72px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: #ffffff; margin-bottom: 30px; word-spacing: 14px; font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Arial Black", sans-serif; }
        
        /* 하단 인류 조상 3단어 (24px 고딕체 스타일 매칭 및 균등 배분) */
        .evolution-row { display: flex; justify-content: space-between; align-items: center; width: 100%; font-size: 24px; font-weight: 800; color: #aaaaaa; text-transform: uppercase; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
        .evo-group { display: inline-block; white-space: nowrap; }

        /* 하단 정보 레이어 */
        .footer { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 40px; box-sizing: border-box; font-size: 12px; color: #555555; }
    </style>
</head>
<body>

    <!-- 상단 시간 축 서사 -->
    <div class="timeline-container">
        <div class="timeline-step">Beyond the 100-year horizon</div>
    </div>

    <!-- 중앙 거대 정렬 프레임 -->
    <div class="center-frame">
        <!-- 1. 중간 크기 정중앙 다음 세대 문구 -->
        <div class="sub-header-top">THE NEXT HUMAN GENERATION</div>
        
        <!-- 2. 압도적인 두께의 고딕체로 벌크업된 마스터 상표명 (72px) -->
        <div class="main">HOMO UNITUS</div>
        
        <!-- 3. 중간 크기 인류 조상 3단계 정렬 -->
        <div class="evolution-row">
            <div class="evo-group">HOMO HABILIS</div>
            <div class="evo-group">HOMO ERECTUS</div>
            <div class="evo-group">HOMO SAPIENS</div>
        </div>
    </div>

    <!-- 하단 좌측 주소 및 우측 설립 프로젝트명 (www. 과감히 삭제 완료) -->
    <div class="footer">
        <div>homounitus.org</div>
        <div>established by MYTHQUANTICA</div>
    </div>

</body>
</html>
